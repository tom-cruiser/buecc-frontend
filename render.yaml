services:
  - type: web
    name: buecc-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        value: https://buecc-backend.onrender.com
    autoDeploy: true
    healthCheckPath: /
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - package.json
        - vite.config.ts
        - tsconfig.json
      ignoredPaths:
        - src/**/*.test.ts
        - src/**/*.spec.ts
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable